<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<title>Тебе письмо 💌</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Тебе письмо 💌">
<meta property="og:description" content="Открой — там кое-что для тебя ✨">
<meta property="og:image" content="https://i-show-nikitka.github.io/letter/preview.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  html,body{height:100%;overflow:hidden;background:#0b0820;color:#fff;font-family:'Cormorant Garamond',Georgia,serif;touch-action:manipulation;overscroll-behavior:none}
  #bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 125%,#4a2155 0%,#21123f 42%,#0b0820 100%)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #fx{z-index:30;pointer-events:none}
  #flash{position:fixed;inset:0;z-index:25;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,#fff 0%,#ffd6e6 25%,rgba(255,150,200,.4) 55%,rgba(255,150,200,0) 80%)}
  #flash.go{animation:flash 1.4s ease-out forwards}

  /* ---------- Конверт ---------- */
  #intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;z-index:10;transition:opacity .8s ease}
  #intro.hide{opacity:0;pointer-events:none}
  .lead{font-family:'Caveat',cursive;font-size:clamp(28px,7.5vw,40px);color:#ffe3ea;text-align:center;padding:0 20px;
        text-shadow:0 0 18px rgba(255,150,190,.6);opacity:0;animation:fadeUp 1.4s ease .4s forwards;transition:opacity .5s}
  .env{position:relative;width:min(78vw,340px);aspect-ratio:1.55;perspective:900px;cursor:pointer;
       animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 18px 40px rgba(255,140,180,.35));
       transition:transform 1s cubic-bezier(.55,0,.75,.2),opacity 1s ease}
  .env>div{position:absolute;border-radius:10px}
  .env-back{inset:0;background:#e9c4b2}
  .letter{left:7%;right:7%;top:7%;height:86%;background:#fffaf2;border-radius:6px!important;display:flex;align-items:flex-start;justify-content:center;padding-top:9%;
          font-family:'Caveat',cursive;font-size:clamp(26px,7vw,36px);color:#d4577f;transition:transform 1s cubic-bezier(.2,.9,.3,1.2) .55s;z-index:2}
  .env-front{inset:0;z-index:3;background:linear-gradient(160deg,#fbe6d8,#efc9b5);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
  .env-flap{left:0;top:0;width:100%;height:62%;z-index:4;background:linear-gradient(#f7d8c6,#eebda8);clip-path:polygon(0 0,100% 0,50% 100%);
            transform-origin:top;transition:transform .7s ease,z-index 0s .35s}
  .seal{position:absolute;left:50%;top:62%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%!important;z-index:5;
        background:radial-gradient(circle at 35% 30%,#ff8fae,#c22a59);display:flex;align-items:center;justify-content:center;
        font-size:26px;color:#ffe3ea;box-shadow:0 3px 10px rgba(120,0,40,.4);animation:pulse 1.6s ease-in-out infinite;transition:opacity .3s,transform .3s}
  .env.open{animation:none}
  .env.open .env-flap{transform:rotateX(180deg);z-index:1}
  .env.open .seal{opacity:0;transform:scale(1.6)}
  .env.open .letter{transform:translateY(-58%)}
  .env.fly{transform:scale(3.2) translateY(-6%);opacity:0}
  .hint{font-family:'Caveat',cursive;font-size:24px;color:#ffd1dc;opacity:.85;animation:breathe 2.2s ease-in-out infinite;transition:opacity .4s}
  #intro.opened .hint,#intro.opened .lead{opacity:0!important;animation:none}

  /* ---------- Текст ---------- */
  #text{position:fixed;left:50%;top:max(6vh,calc(18px + env(safe-area-inset-top)));transform:translateX(-50%);width:min(92vw,520px);
        text-align:center;z-index:5;pointer-events:none;transition:opacity 1s ease,transform 1s ease}
  #text::before{content:'';position:absolute;inset:-40px -30px;z-index:-1;
                background:radial-gradient(ellipse at 50% 45%,rgba(11,8,32,.62) 0%,rgba(11,8,32,.35) 45%,rgba(11,8,32,0) 72%)}
  #text.away{opacity:0;transform:translate(-50%,-14px)}
  #title{font-family:'Caveat',cursive;font-weight:700;font-size:clamp(40px,11vw,70px);line-height:1;margin-bottom:8px;color:#ffe9f0;
         text-shadow:0 0 18px rgba(255,140,190,.85),0 0 42px rgba(255,90,160,.45)}
  #since{font-family:'Caveat',cursive;font-size:23px;color:#ffd9a8;margin-bottom:8px;opacity:0;transition:opacity 1.2s;text-shadow:0 0 12px rgba(255,200,120,.5)}
  #since.show{opacity:1}
  #msg{font-size:clamp(19px,5.1vw,23px);line-height:1.5;min-height:4.5em;color:#fff4f8;
       text-shadow:0 0 14px rgba(255,150,200,.45),0 1px 3px rgba(0,0,0,.7)}
  #sign{font-family:'Caveat',cursive;font-size:25px;color:#ffc4d4;margin-top:6px;opacity:0;transition:opacity 1.2s;text-shadow:0 0 12px rgba(255,150,200,.6)}
  #sign.show{opacity:1}
  .word{display:inline-block;white-space:nowrap}
  .ch{display:inline-block;opacity:0;animation:chIn 1.1s cubic-bezier(.2,.8,.2,1) forwards}
  .w{display:inline-block;opacity:0;animation:wIn 1.1s cubic-bezier(.2,.7,.2,1) forwards}
  .out .w{animation:wOut .45s ease forwards!important;animation-delay:0s!important}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px;pointer-events:auto}
  .btn{font-family:'Caveat',cursive;font-size:24px;color:#ffe3ea;padding:7px 24px;border-radius:999px;cursor:pointer;
       background:rgba(255,143,177,.16);border:1px solid rgba(255,170,195,.6);opacity:0;transform:translateY(10px);
       transition:opacity .8s,transform .8s;touch-action:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .btn.show{opacity:1;transform:none}
  .btn:active{transform:scale(.96)}
  #hold{--p:0;background:linear-gradient(90deg,rgba(255,110,160,.8) calc(var(--p)*100%),rgba(255,143,177,.16) 0);
        box-shadow:0 0 calc(var(--p)*34px) rgba(255,120,170,calc(var(--p)*.95))}
  #hold.show{animation:holdGlow 2.4s ease-in-out 1s infinite}
  #tip{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:64px;right:64px;text-align:center;z-index:5;font-family:'Caveat',cursive;
       font-size:20px;white-space:nowrap;color:rgba(255,220,230,.85);opacity:0;transition:opacity 1.2s;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  #tip.show{opacity:1}
  #music{position:fixed;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;width:42px;height:42px;border-radius:50%;
         border:1px solid rgba(255,200,215,.4);background:rgba(255,255,255,.08);color:#ffe3ea;font-size:19px;cursor:pointer;opacity:0;
         transition:opacity 1s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #music.show{opacity:1}
  #music.off{opacity:.4}

  @keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-12px) rotate(1deg)}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,120,160,.55)}60%{box-shadow:0 0 0 16px rgba(255,120,160,0)}}
  @keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes flash{0%{opacity:0}18%{opacity:.95}100%{opacity:0}}
  @keyframes chIn{0%{opacity:0;transform:translateY(-14px) scale(1.7);filter:blur(12px)}100%{opacity:1;transform:none;filter:blur(0)}}
  @keyframes wIn{0%{opacity:0;transform:translateY(12px);filter:blur(10px)}100%{opacity:1;transform:none;filter:blur(0)}}
  @keyframes wOut{0%{opacity:1;filter:blur(0)}100%{opacity:0;transform:translateY(-10px);filter:blur(8px)}}
  @keyframes holdGlow{0%,100%{box-shadow:0 0 0 rgba(255,120,170,0)}50%{box-shadow:0 0 22px rgba(255,120,170,.55)}}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="c"></canvas>

<div id="intro">
  <div class="lead">У меня для тебя кое-что есть…</div>
  <div class="env" id="env">
    <div class="env-back"></div>
    <div class="letter">Тебе ♡</div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <div class="seal">♥</div>
  </div>
  <div class="hint">нажми на конверт</div>
</div>

<div id="text">
  <div id="title"></div>
  <div id="since"></div>
  <div id="msg"></div>
  <div id="sign"></div>
  <div class="btns">
    <button class="btn" id="more">ещё ♡</button>
    <button class="btn" id="hold">подержи ❤</button>
  </div>
</div>
<div id="tip"></div>
<button id="music" title="музыка">♪</button>
<div id="flash"></div>
<canvas id="fx"></canvas>

<script>
/* ================== НАСТРОЙКИ — меняй тут ================== */
const CONFIG = {
  name: "",          // её имя, например "Аня" (пусто — будет «Это тебе»)
  from: "",          // подпись, например "твой Ник" (пусто — без подписи)
  since: "",         // дата знакомства "2025-09-01" — появится «мы знакомы уже N дней» (пусто — не показывать)
  finale: "",        // надпись из искр в финале (пусто — «Аня, ты чудо» или «Ты — чудо»)
  message: "Просто хотел напомнить: ты делаешь этот мир заметно теплее. Пусть сегодня всё получается легко, а улыбка не сходит с лица 🌸",
  compliments: [
    "У тебя самая заразительная улыбка — проверено ✨",
    "С тобой даже обычный день становится каким-то особенным",
    "Ты умеешь поднимать настроение одним сообщением. Это суперсила 💫",
    "Ты красивая. Без всяких «но» и «если» 🌷",
    "Мир правда стал лучше, когда в нём появилась ты",
    "Твой смех — лучший звук на свете",
    "Ты сильнее, чем думаешь, и справишься со всем 💪",
    "Если бы звёзды умели завидовать — они бы завидовали твоим глазам",
    "Ты заслуживаешь всего самого тёплого и доброго ☕",
    "Спасибо, что ты есть. Серьёзно 💗",
    "Даже это северное сияние включилось, потому что ты открыла письмо 🌌",
    "Сегодня отличный день, чтобы быть собой — то есть замечательной"
  ]
};
/* =========================================================== */

try { const q = new URLSearchParams(location.search); for (const k of ['name', 'from', 'since', 'finale']) if (q.get(k)) CONFIG[k] = q.get(k); } catch (e) {}

const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d'), fx = $('fx'), fctx = fx.getContext('2d');
let W, H, DPR;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeBack = x => { const c1 = 1.70158, c3 = c1 + 1; return Math.max(0, 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2)); };
const now = () => performance.now() / 1000;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function setTip(text) { const t = $('tip'); t.classList.remove('show'); setTimeout(() => { t.textContent = text; if (text) t.classList.add('show'); }, 400); }
const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

/* ================== ЗВУК ================== */
let ac, master, musicGain, musicOn = false, musicTimer = null, nextT = 0, step = 0;
function audio() {
  if (!ac) {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.connect(ac.destination);
    musicGain = ac.createGain(); musicGain.connect(master);
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(freq, when, vol = .08, type = 'sine', dur = 1.6, dest) {
  try {
    const a = audio(), t = when ?? a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + dur + .05);
  } catch (e) {}
}
const NOTES = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.7, 1318.5];
const chime = (f, d = 0, v = .07) => { try { tone(f || NOTES[Math.random() * 6 | 0], audio().currentTime + d, v); } catch (e) {} };
const MEL = [659.25, 783.99, 1046.5, 783.99, 587.33, 783.99, 987.77, 783.99, 523.25, 659.25, 880, 659.25, 698.46, 880, 1046.5, 880];
const BASS = [130.81, 98, 110, 87.31];
function scheduler() {
  while (nextT < ac.currentTime + .25) {
    const i = step % 16;
    tone(MEL[i], nextT, .035, 'triangle', 1.3, musicGain);
    tone(MEL[i] * 2, nextT, .006, 'sine', .8, musicGain);
    if (i % 4 === 0) tone(BASS[(i / 4) | 0], nextT, .045, 'sine', 2.6, musicGain);
    if (step % 32 === 30) tone(1567.98, nextT + .15, .02, 'sine', 1.5, musicGain);
    nextT += .32; step++;
  }
}
function musicStart() { audio(); musicOn = true; nextT = ac.currentTime + .15; clearInterval(musicTimer); musicTimer = setInterval(scheduler, 60); $('music').classList.remove('off'); }
function musicStop() { musicOn = false; clearInterval(musicTimer); $('music').classList.add('off'); }
$('music').addEventListener('click', e => { e.stopPropagation(); musicOn ? musicStop() : musicStart(); });

/* ================== СЦЕНА ================== */
let stars = [], flies = [], petals = [], hearts = [], flowers = [], shooters = [], rockets = [], sparks = [], magic = [], magicLine = [];
let started = false, mode = 'intro', px = 0, py = 0, tpx = 0, tpy = 0, auroraA = .22, auroraT = .22;
const aur = document.createElement('canvas'), actx = aur.getContext('2d');

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fx.width = W * DPR; fx.height = H * DPR; fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  aur.width = 110; aur.height = Math.max(60, Math.round(110 * H / W));
  if (started) layoutFlowers(false);
  if (mode === 'finale') buildMagicTargets();
}
window.addEventListener('resize', resize);
window.addEventListener('pointermove', e => { tpx = e.clientX / W * 2 - 1; tpy = e.clientY / H * 2 - 1; });
window.addEventListener('deviceorientation', e => { if (e.gamma == null) return; tpx = clamp(e.gamma / 30, -1, 1); tpy = clamp((e.beta - 45) / 30, -1, 1); });

for (let i = 0; i < 180; i++) stars.push({ x: Math.random(), y: Math.random() * .8, r: rand(.4, 1.6), ph: rand(0, 6.3), sp: rand(.6, 2), d: rand(.3, 1) });
for (let i = 0; i < 34; i++) flies.push({ x: Math.random(), y: rand(.3, 1), vx: 0, vy: 0, ph: rand(0, 6.3) });

const spriteCache = {};
function sprite(hue, sat = 90, lit = 70) {
  hue = Math.round(hue); const k = hue + '-' + sat + '-' + lit;
  if (spriteCache[k]) return spriteCache[k];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, `hsla(${hue},${sat}%,96%,1)`); gr.addColorStop(.2, `hsla(${hue},${sat}%,${lit}%,.85)`); gr.addColorStop(1, `hsla(${hue},${sat}%,${lit}%,0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return spriteCache[k] = c;
}
function glow(spr, x, y, r, a, c = ctx) { c.globalAlpha = clamp(a); c.drawImage(spr, x - r, y - r, r * 2, r * 2); c.globalAlpha = 1; }

/* ---------- северное сияние ---------- */
const BANDS = [
  { hue: 155, base: .09, len: .24, sp: .22, amp: .045 },
  { hue: 300, base: .16, len: .20, sp: -.18, amp: .04 },
  { hue: 188, base: .23, len: .16, sp: .3, amp: .035 }
];
function drawAurora(t) {
  const w = aur.width, h = aur.height;
  actx.globalCompositeOperation = 'source-over'; actx.clearRect(0, 0, w, h);
  actx.globalCompositeOperation = 'lighter';
  BANDS.forEach((b, bi) => {
    const top = h * (b.base - b.amp), bottom = h * (b.base + b.amp + b.len);
    const g = actx.createLinearGradient(0, top, 0, bottom);
    g.addColorStop(0, `hsla(${b.hue},90%,65%,0)`); g.addColorStop(.18, `hsla(${b.hue},95%,62%,.95)`);
    g.addColorStop(.55, `hsla(${b.hue + 25},90%,60%,.35)`); g.addColorStop(1, `hsla(${b.hue + 35},90%,60%,0)`);
    actx.fillStyle = g;
    for (let x = 0; x < w; x++) {
      const yt = h * (b.base + b.amp * Math.sin(x * .045 + t * b.sp + bi * 2) + b.amp * .5 * Math.sin(x * .11 - t * b.sp * 1.7));
      const ray = .5 + .5 * Math.sin(x * .38 + t * 1.1 + bi) * Math.sin(x * .07 - t * .45 + bi * 3);
      actx.globalAlpha = .18 + .82 * ray * ray;
      actx.fillRect(x, yt, 1, h * b.len * (.7 + .3 * Math.sin(x * .05 + t * .6 + bi)));
    }
  });
  actx.globalAlpha = 1;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = auroraA * .8; ctx.imageSmoothingEnabled = true;
  ctx.drawImage(aur, -px * 8, -py * 6, W + 16, H + 12); ctx.restore();
}

/* ---------- цветы ---------- */
const PALETTE = [
  { hue: 340, sat: 85, lit: 72 }, { hue: 350, sat: 90, lit: 64 }, { hue: 330, sat: 80, lit: 78 },
  { hue: 12, sat: 90, lit: 72 }, { hue: 280, sat: 60, lit: 74 }, { hue: 45, sat: 95, lit: 70 }, { hue: 200, sat: 70, lit: 80 }
];
function makeFlower(x, topY, start) {
  const p = PALETTE[Math.random() * PALETTE.length | 0], h = H - topY;
  return {
    x0: x, y0: H + 6, x1: x + rand(-35, 35), y1: topY, cx: x + rand(-30, 30), cy: H - h * .5,
    start, dur: rand(1.4, 2.4), ph: rand(0, 6.3), amp: rand(4, 9),
    w: rand(2, 3.2), n: 5 + (Math.random() * 4 | 0), len: rand(13, 24) * (W < 500 ? .9 : 1.1),
    wd: rand(.22, .34), rot: rand(0, 6.3), ...p,
    stemC: `hsl(${rand(110, 140)},38%,${rand(32, 42)}%)`, leafC: `hsl(${rand(105, 135)},42%,${rand(36, 46)}%)`,
    leaves: [{ s: rand(.25, .4), a: rand(-.9, -.4), len: rand(14, 22) }, { s: rand(.45, .62), a: Math.PI + rand(.4, .9), len: rand(12, 20) }]
  };
}
function layoutFlowers(fresh) {
  const n = clamp(Math.round(W / 46), 8, 28), t = now(), base = [];
  for (let i = 0; i < n; i++) base.push(makeFlower(W * (i + .5) / n + rand(-14, 14), H - H * rand(.16, .38), fresh ? t + rand(0, 1.8) : t - 10));
  flowers = base.concat(flowers.filter(f => f.user));
}
function qp(f, s, sw) {
  const a = 1 - s;
  return [a * a * f.x0 + 2 * a * s * f.cx + s * s * f.x1 + sw * s * s, a * a * f.y0 + 2 * a * s * f.cy + s * s * f.y1];
}
function drawFlower(f, t) {
  const age = t - f.start; if (age <= 0) return;
  const g = easeOut(clamp(age / f.dur)), sw = Math.sin(t * .9 + f.ph) * f.amp;
  ctx.strokeStyle = f.stemC; ctx.lineWidth = f.w; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i <= 24; i++) { const [x, y] = qp(f, g * i / 24, sw); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke();
  for (const L of f.leaves) {
    if (g <= L.s) continue;
    const k = easeOut(clamp((g - L.s) / .25)), [x, y] = qp(f, L.s, sw);
    ctx.save(); ctx.translate(x, y); ctx.rotate(L.a + Math.sin(t * 1.2 + f.ph) * .06);
    ctx.fillStyle = f.leafC; ctx.beginPath(); ctx.ellipse(L.len * .5 * k, 0, L.len * .5 * k + .01, L.len * .2 * k + .01, 0, 0, 7); ctx.fill();
    ctx.restore();
  }
  const b = easeBack(clamp((age - f.dur * .85) / 1.1)); if (b <= 0) return;
  const [hx, hy] = qp(f, 1, sw);
  glow(sprite(f.hue, 90, 75), hx, hy, f.len * 2.6 * b + .1, .45);
  ctx.save(); ctx.translate(hx, hy); ctx.rotate(f.rot + sw * .02 + t * .04);
  for (let layer = 0; layer < 2; layer++) {
    const len = f.len * (layer ? .6 : 1) * b;
    ctx.fillStyle = `hsl(${f.hue},${f.sat}%,${layer ? f.lit + 12 : f.lit}%)`;
    for (let k = 0; k < f.n; k++) {
      ctx.save(); ctx.rotate(k * 6.2832 / f.n + (layer ? Math.PI / f.n : 0));
      ctx.beginPath(); ctx.ellipse(len * .55, 0, len * .55 + .01, len * f.wd + .01, 0, 0, 7); ctx.fill();
      ctx.restore();
    }
  }
  ctx.fillStyle = '#ffd86b'; ctx.beginPath(); ctx.arc(0, 0, f.len * .22 * b + .01, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(-f.len * .06 * b, -f.len * .06 * b, f.len * .07 * b + .01, 0, 7); ctx.fill();
  ctx.restore();
}

/* ---------- сердечки ---------- */
function heartPath(s, c) {
  c.beginPath(); c.moveTo(0, -s * .2);
  c.bezierCurveTo(0, -s * .5, -s * .5, -s * .5, -s * .5, -s * .2);
  c.bezierCurveTo(-s * .5, s * .1, 0, s * .3, 0, s * .5);
  c.bezierCurveTo(0, s * .3, s * .5, s * .1, s * .5, -s * .2);
  c.bezierCurveTo(s * .5, -s * .5, 0, -s * .5, 0, -s * .2);
  c.fill();
}
function burst(x, y, n = 14) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.28), sp = rand(1.5, 5);
    hearts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2, life: 1, s: rand(10, 22), hue: rand(330, 360), rot: rand(-.5, .5) });
  }
}

/* ---------- салют ---------- */
function launch(x, delay = 0) {
  setTimeout(() => {
    rockets.push({ x: x ?? rand(W * .15, W * .85), y: H + 10, vy: -rand(9, 12), ty: rand(H * .1, H * .38), hue: [340, 20, 45, 290, 200][Math.random() * 5 | 0] });
    tone(rand(180, 260), undefined, .03, 'sine', .6);
  }, delay);
}
function explode(r) {
  const n = 46, heartShape = Math.random() < .45;
  for (let i = 0; i < n; i++) {
    const t = i / n * 6.283; let vx, vy;
    if (heartShape) { vx = 16 * Math.pow(Math.sin(t), 3) * .28; vy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * .28; }
    else { const sp = rand(2, 5.5); vx = Math.cos(t) * sp; vy = Math.sin(t) * sp; }
    sparks.push({ x: r.x, y: r.y, vx, vy, life: 1, hue: r.hue + rand(-15, 15), d: rand(.010, .016) });
  }
  chime(NOTES[3 + (Math.random() * 4 | 0)], 0, .05);
}

/* ---------- финал: созвездие-сердце и надпись из искр ---------- */
let magicCenter = { x: 0, y: 0 };
function textPoints(text, cx, cy, maxW) {
  const c = document.createElement('canvas'), g = c.getContext('2d');
  let fs = Math.min(W * .14, 96);
  g.font = `700 ${fs}px Caveat, cursive`;
  while (g.measureText(text).width > maxW && fs > 20) { fs -= 2; g.font = `700 ${fs}px Caveat, cursive`; }
  const tw = Math.ceil(g.measureText(text).width) + 10, th = Math.ceil(fs * 1.4);
  c.width = tw; c.height = th;
  g.font = `700 ${fs}px Caveat, cursive`; g.fillStyle = '#fff'; g.textBaseline = 'middle'; g.fillText(text, 5, th / 2);
  const data = g.getImageData(0, 0, tw, th).data, pts = [], st = Math.max(2, Math.round(fs / 24));
  for (let y = 0; y < th; y += st) for (let x = 0; x < tw; x += st) if (data[(y * tw + x) * 4 + 3] > 140) pts.push([cx - tw / 2 + x, cy - th / 2 + y]);
  while (pts.length > 900) pts.splice(Math.random() * pts.length | 0, 1);
  return pts;
}
function buildMagicTargets() {
  const sc = Math.min(W, H * .75) * .016, cx = W / 2, cy = H * .29;
  magicCenter = { x: cx, y: cy };
  const pts = [];
  for (let i = 0; i < 170; i++) {
    const t = i / 170 * 6.283;
    pts.push({ x: cx + 16 * Math.pow(Math.sin(t), 3) * sc, y: cy - (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * sc, hue: 345, s: 7, h: 1, o: i });
  }
  for (let i = 0; i < 150; i++) {
    const t = rand(0, 6.283), k = Math.sqrt(Math.random()) * .9;
    const ex = 16 * Math.pow(Math.sin(t), 3), ey = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    pts.push({ x: cx + ex * k * sc, y: cy - (2 + (ey - 2) * k) * sc, hue: rand(330, 355), s: 5, h: 1, o: -1 });
  }
  const label = CONFIG.finale || (CONFIG.name ? `${CONFIG.name}, ты чудо` : 'Ты — чудо');
  for (const [x, y] of textPoints(label, W / 2, cy + 17 * sc + Math.min(52, H * .06), W * .9)) pts.push({ x, y, hue: 42, s: 3, h: 0, o: -1 });
  pts.sort(() => Math.random() - .5);
  while (magic.length < pts.length) magic.push({ x: rand(0, W), y: rand(H * .4, H), a: 0, ph: rand(0, 6.3) });
  magic.length = pts.length;
  magic.forEach((m, i) => Object.assign(m, { tx: pts[i].x, ty: pts[i].y, hue: pts[i].hue, s: pts[i].s, h: pts[i].h, o: pts[i].o, delay: now() + rand(0, 1.2), leaving: false }));
  magicLine = magic.filter(m => m.o >= 0 && m.o % 10 === 0).sort((a, b) => a.o - b.o);
}

let holding = false, holdP = 0, lastHoldNote = 0, holdNote = 0, finaleAt = 0;
async function finale() {
  mode = 'finale'; finaleAt = now(); holding = false; holdP = 0; auroraT = 1;
  $('text').classList.add('away'); $('text').style.pointerEvents = 'none'; setTip('');
  $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').style.opacity = ''; $('flash').classList.add('go');
  magic = flies.map(f => ({ x: f.x * W, y: f.y * H, a: 0, ph: rand(0, 6.3) }));
  buildMagicTargets();
  chime(523.25, 0, .08); chime(659.25, .12, .08); chime(783.99, .24, .08); chime(1046.5, .4, .08); chime(1318.5, .6, .06);
  for (let i = 0; i < 8; i++) launch(undefined, 300 + i * 420);
  vibrate([30, 60, 30]);
  await sleep(4500);
  if (mode === 'finale') setTip('коснись, чтобы вернуться');
}
function endFinale() {
  mode = 'main'; auroraT = .9; magicLine = [];
  for (const m of magic) { m.leaving = true; const a = rand(0, 6.28); m.tx = m.x + Math.cos(a) * rand(200, 600); m.ty = m.y + Math.sin(a) * rand(200, 600); }
  setTimeout(() => { if (mode === 'main') magic = []; }, 2500);
  $('text').classList.remove('away'); $('text').style.pointerEvents = '';
  setTip('коснись — вырастет цветок 🌷');
}

/* ================== КАДР ================== */
let lastT = now(), nextShooter = now() + 2.5;
function frame() {
  const t = now(), dt = Math.min(.05, t - lastT); lastT = t;
  px += (tpx - px) * .05; py += (tpy - py) * .05;
  auroraA += (auroraT - auroraA) * .012;
  ctx.clearRect(0, 0, W, H); fctx.clearRect(0, 0, W, H);

  for (const s of stars) {
    const a = .35 + .65 * Math.abs(Math.sin(t * s.sp + s.ph));
    ctx.fillStyle = `rgba(255,245,255,${a})`; ctx.beginPath();
    ctx.arc(s.x * W - px * 14 * s.d, s.y * H - py * 10 * s.d, s.r, 0, 7); ctx.fill();
  }
  drawAurora(t);
  const mx = W * .84 - px * 6, my = H * .1 + 20 - py * 4, r = Math.min(30, W * .06);
  glow(sprite(35, 100, 88), mx, my, r * 4.5, .35);
  ctx.fillStyle = '#fff1dc'; ctx.beginPath(); ctx.arc(mx, my, r, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(230,200,170,.35)'; ctx.beginPath(); ctx.arc(mx - r * .3, my - r * .2, r * .18, 0, 7); ctx.arc(mx + r * .25, my + r * .3, r * .12, 0, 7); ctx.fill();

  if (t > nextShooter) {
    nextShooter = t + rand(2.5, 7);
    const sp = rand(9, 14);
    shooters.push({ x: rand(W * .2, W), y: rand(0, H * .3), vx: -sp * rand(.6, .9), vy: sp * rand(.35, .55), life: 1 });
  }
  for (let i = shooters.length - 1; i >= 0; i--) {
    const s = shooters[i]; s.x += s.vx; s.y += s.vy; s.life -= .018;
    if (s.life <= 0) { shooters.splice(i, 1); continue; }
    const g = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 10, s.y - s.vy * 10);
    g.addColorStop(0, `rgba(255,250,240,${s.life})`); g.addColorStop(1, 'rgba(255,250,240,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 10, s.y - s.vy * 10); ctx.stroke();
    glow(sprite(40, 60, 90), s.x, s.y, 8, s.life);
  }

  if (started) {
    for (const f of flowers) drawFlower(f, t);
    const gg = ctx.createLinearGradient(0, H - 70, 0, H);
    gg.addColorStop(0, 'rgba(18,10,38,0)'); gg.addColorStop(1, 'rgba(18,10,38,.85)');
    ctx.fillStyle = gg; ctx.fillRect(0, H - 70, W, 70);
    for (const p of petals) {
      p.y += p.vy; p.x += Math.sin(t * p.sw + p.ph) * .6; p.r += p.vr;
      if (p.y > H + 20) { p.y = -20; p.x = rand(0, W); }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(1, Math.abs(Math.sin(t * 1.5 + p.ph)) * .7 + .3);
      ctx.fillStyle = `hsla(${p.hue},85%,80%,.75)`; ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * .55, 0, 0, 7); ctx.fill();
      ctx.restore();
    }
  }

  if (mode !== 'finale') {
    const fs = sprite(50, 100, 72);
    for (const f of flies) {
      f.vx += rand(-.02, .02); f.vy += rand(-.02, .02); f.vx *= .98; f.vy *= .98;
      f.x += f.vx / W * 60; f.y += f.vy / H * 60;
      if (f.x < 0) f.x = 1; if (f.x > 1) f.x = 0; if (f.y < .25) f.vy += .03; if (f.y > 1) f.y = .3;
      glow(fs, f.x * W, f.y * H, 9, .3 + .7 * Math.abs(Math.sin(t * 1.3 + f.ph)));
    }
  }

  if (magic.length) {
    const beat = 1 + .045 * Math.pow(Math.abs(Math.sin(t * 2.2)), 6);
    const settle = clamp((t - finaleAt - 2.2) / 1.5);
    if (magicLine.length && settle > 0) {
      ctx.save(); ctx.strokeStyle = `rgba(255,200,225,${.4 * settle})`; ctx.lineWidth = 1; ctx.beginPath();
      magicLine.forEach((m, i) => i ? ctx.lineTo(m.x, m.y) : ctx.moveTo(m.x, m.y)); ctx.closePath(); ctx.stroke(); ctx.restore();
      for (const m of magicLine) glow(sprite(330, 40, 92), m.x, m.y, 14 * settle * (1 + .3 * Math.sin(t * 3 + m.ph)), .9 * settle);
    }
    for (const m of magic) {
      if (t < m.delay && !m.leaving) { glow(sprite(m.hue), m.x, m.y, m.s, .3); continue; }
      let tx = m.tx, ty = m.ty;
      if (m.h && !m.leaving) { tx = magicCenter.x + (m.tx - magicCenter.x) * beat; ty = magicCenter.y + (m.ty - magicCenter.y) * beat; }
      m.x += (tx - m.x) * (m.leaving ? .03 : .07); m.y += (ty - m.y) * (m.leaving ? .03 : .07);
      m.a = m.leaving ? m.a * .96 : Math.min(1, m.a + .03);
      const tw = .65 + .35 * Math.sin(t * 4 + m.ph);
      glow(sprite(m.hue, 95, m.hue === 42 ? 72 : 68), m.x + Math.sin(t * 2 + m.ph) * .6, m.y + Math.cos(t * 2 + m.ph) * .6, m.s * (1 + .3 * tw), m.a * tw);
    }
  }

  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i]; r.y += r.vy; r.vy *= .985;
    glow(sprite(r.hue, 80, 80), r.x, r.y, 6, 1, fctx);
    if (r.y <= r.ty || r.vy > -2) { explode(r); rockets.splice(i, 1); }
  }
  fctx.globalCompositeOperation = 'lighter';
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.x += s.vx; s.y += s.vy; s.vx *= .975; s.vy = s.vy * .975 + .04; s.life -= s.d;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    glow(sprite(s.hue), s.x, s.y, 5 + 3 * s.life, s.life, fctx);
  }
  fctx.globalCompositeOperation = 'source-over';
  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i];
    h.x += h.vx; h.y += h.vy; h.vx *= .96; h.vy = h.vy * .96 - .05; h.life -= .012;
    if (h.life <= 0) { hearts.splice(i, 1); continue; }
    fctx.save(); fctx.globalAlpha = h.life; fctx.translate(h.x, h.y); fctx.rotate(h.rot);
    fctx.fillStyle = `hsl(${h.hue},90%,70%)`; heartPath(h.s * (1.2 - h.life * .2), fctx); fctx.restore();
  }

  if (mode === 'main') {
    if (holding) {
      holdP = Math.min(1, holdP + dt / 1.8);
      if (t - lastHoldNote > .14) { lastHoldNote = t; tone(NOTES[Math.min(holdNote++, NOTES.length - 1)], undefined, .05); }
      if (Math.random() < .35) { const b = $('hold').getBoundingClientRect(); hearts.push({ x: rand(b.left, b.right), y: b.top, vx: rand(-.5, .5), vy: -rand(1, 2.5), life: 1, s: rand(8, 14), hue: rand(330, 360), rot: rand(-.4, .4) }); }
      if (holdP >= 1) finale();
    } else { holdP = Math.max(0, holdP - dt * 1.5); holdNote = 0; }
    $('hold').style.setProperty('--p', holdP.toFixed(3));
  }
  requestAnimationFrame(frame);
}

/* ================== ТЕКСТ ================== */
function revealChars(el, text, stepMs = 65) {
  el.innerHTML = ''; let i = 0;
  text.split(' ').forEach((word, wi, arr) => {
    const w = document.createElement('span'); w.className = 'word';
    for (const ch of Array.from(word)) { const s = document.createElement('span'); s.className = 'ch'; s.textContent = ch; s.style.animationDelay = (i++ * stepMs) + 'ms'; w.appendChild(s); }
    el.appendChild(w); if (wi < arr.length - 1) { el.appendChild(document.createTextNode(' ')); i++; }
  });
  return sleep(i * stepMs + 900);
}
function revealWords(el, text, stepMs = 110) {
  el.classList.remove('out'); el.innerHTML = '';
  const words = text.split(' ');
  words.forEach((word, i) => {
    const s = document.createElement('span'); s.className = 'w'; s.textContent = word; s.style.animationDelay = (i * stepMs) + 'ms';
    el.appendChild(s); if (i < words.length - 1) el.appendChild(document.createTextNode(' '));
  });
  return sleep(words.length * stepMs + 900);
}

let order = [...CONFIG.compliments].sort(() => Math.random() - .5), ci = 0, busy = false;
$('more').addEventListener('click', async e => {
  e.stopPropagation(); if (busy) return; busy = true;
  const r = e.currentTarget.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, 18); chime(); vibrate(15);
  const m = $('msg'); m.classList.add('out');
  await sleep(450);
  await revealWords(m, order[ci++ % order.length], 70);
  busy = false;
});

const hold = $('hold');
hold.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); audio(); holding = true; try { hold.setPointerCapture(e.pointerId); } catch (_) {} });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => hold.addEventListener(ev, () => holding = false));
hold.addEventListener('contextmenu', e => e.preventDefault());

async function startMain() {
  started = true; mode = 'main'; auroraT = .9;
  layoutFlowers(true);
  for (let i = 0; i < 18; i++) petals.push({ x: rand(0, W), y: rand(-H, 0), vy: rand(.5, 1.3), r: rand(0, 6), vr: rand(-.03, .03), s: rand(4, 7), hue: rand(330, 360), sw: rand(.5, 1.5), ph: rand(0, 6) });
  await sleep(700);
  $('music').classList.add('show');
  await revealChars($('title'), CONFIG.name ? `${CONFIG.name}, это тебе\u00a0✨` : 'Это тебе\u00a0✨');
  const since = Date.parse(CONFIG.since);
  if (since) {
    const d = Math.max(0, Math.floor((Date.now() - since) / 864e5)), m10 = d % 10, m100 = d % 100;
    const w = m10 === 1 && m100 !== 11 ? 'день' : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? 'дня' : 'дней';
    $('since').textContent = `мы знакомы уже ${d} ${w} 💫`; $('since').classList.add('show');
    await sleep(700);
  } else $('since').style.display = 'none';
  await revealWords($('msg'), CONFIG.message, 120);
  if (CONFIG.from) { $('sign').textContent = '— ' + CONFIG.from; $('sign').classList.add('show'); await sleep(600); }
  $('more').classList.add('show');
  await sleep(350);
  $('hold').classList.add('show');
  setTip('коснись — вырастет цветок 🌷');
}

$('env').addEventListener('click', () => {
  const env = $('env'); if (env.classList.contains('open')) return;
  env.classList.add('open'); $('intro').classList.add('opened');
  audio(); vibrate(20);
  chime(523.25, 0); chime(659.25, .15); chime(783.99, .3); chime(1046.5, .5, .06);
  setTimeout(() => {
    env.classList.add('fly'); $('flash').classList.add('go');
    const r = env.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height * .4, 30);
    chime(1318.5, 0, .05); chime(1567.98, .1, .04);
  }, 1500);
  setTimeout(() => { $('intro').classList.add('hide'); startMain(); }, 1900);
  setTimeout(musicStart, 2300);
});

document.addEventListener('pointerdown', e => {
  if (!started || e.target.closest('button')) return;
  if (mode === 'finale') { if (now() - finaleAt > 3) endFinale(); else { burst(e.clientX, e.clientY, 10); chime(); } return; }
  burst(e.clientX, e.clientY, 12); chime();
  const f = makeFlower(e.clientX, clamp(e.clientY, H * .5, H - 70), now()); f.user = true; f.dur = 1.1;
  flowers.push(f);
  const userFl = flowers.filter(x => x.user);
  if (userFl.length > 40) flowers.splice(flowers.indexOf(userFl[0]), 1);
});
document.addEventListener('visibilitychange', () => { if (!ac) return; document.hidden ? ac.suspend() : ac.resume(); });

resize();
requestAnimationFrame(frame);
</script>
